<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Care Portal</title><link rel="stylesheet" href="/assets/index-CrbUckoN.css"></head><body><div id="app"><main class="login-shell"><div class="login-card"><div class="brand-mark">GL</div><p class="eyebrow">CARE PORTAL DEMO</p><h1>Welcome back</h1><p class="muted">Sign in to view your protection dashboard.</p><form id="static-login-form"><label>Username<input id="static-username" name="username" value="alex.customer" autocomplete="username" required></label><label>Password<input id="static-password" name="password" type="password" value="CarePortal!2026" autocomplete="current-password" required></label><p id="static-login-error" class="error" role="alert" hidden></p><button class="primary-button" type="submit">Sign in securely</button></form><div class="demo-credentials"><strong>Demo accounts</strong><span>Customer: alex.customer / CarePortal!2026</span><span>Support: maya.support / SupportDesk!2026</span></div><noscript><p class="error">JavaScript must be enabled to complete sign in.</p></noscript></div></main></div><script>document.getElementById('static-login-form')?.addEventListener('submit',async function(event){event.preventDefault();const error=document.getElementById('static-login-error');const button=this.querySelector('button');error.hidden=true;button.disabled=true;button.textContent='Signing in...';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('static-username').value,password:document.getElementById('static-password').value})});if(!response.ok)throw new Error('Invalid demo credentials.');const result=await response.json();localStorage.setItem('care_portal_access_token',result.accessToken);localStorage.setItem('care_portal_user',JSON.stringify(result.user));window.location.reload();}catch(exception){error.textContent=exception instanceof Error?exception.message:'Unable to sign in.';error.hidden=false;button.disabled=false;button.textContent='Sign in securely';}});</script><script type="module" src="/src/main.ts"></script></body></html>
