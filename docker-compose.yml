services:
  globelife-care-portal:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Redis__ConnectionString: ${REDIS_CONNECTION_STRING:-redis:6379}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-change-this-signing-key-32-chars}
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  redis-data:
