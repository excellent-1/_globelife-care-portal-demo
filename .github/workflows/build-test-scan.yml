name: build-test-scan
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: src/globelife-web/package.json }
      - name: Build API
        run: dotnet build src/GlobeLife.Api/GlobeLife.Api.csproj --configuration Release
      - name: Build frontend
        working-directory: src/globelife-web
        run: npm install && npm run build
      - name: Build Docker image
        run: docker build --tag globelife-care-portal:ci .
      - name: Terraform validate
        run: terraform -chdir=infra/terraform init -backend=false && terraform -chdir=infra/terraform validate
